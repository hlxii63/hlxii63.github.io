<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>试卷难度 · 得分分布 · 实力估计（理性分配 · JSON导入导出）</title>
<style>
  * { box-sizing:border-box; font-family:system-ui,'Segoe UI',Roboto,sans-serif; }
  body{ background:#f4f7fc; margin:0; padding:2rem 1rem; display:flex; justify-content:center; }
  .container{ max-width:1080px; width:100%; background:#fff; padding:2rem; border-radius:24px; box-shadow:0 8px 30px rgba(0,0,0,.07); }
  h1{ font-size:1.5rem; margin-top:0; color:#0b1e33; border-bottom:2px solid #eef2f6; padding-bottom:.6rem; }
  .row{ display:flex; flex-wrap:wrap; gap:.8rem 1.3rem; align-items:center; margin:.8rem 0; }
  .row label{ font-weight:600; color:#1e293b; font-size:.93rem; }
  .row input[type=number], .row input:not([type=file]){ width:104px; padding:.4rem .6rem; border:1px solid #cbd5e1; border-radius:8px; font-size:.93rem; text-align:center; }
  button{ padding:.5rem 1.1rem; border:none; border-radius:40px; font-weight:600; font-size:.9rem; cursor:pointer; }
  .primary{ background:#2563eb; color:#fff; } .ghost{ background:#eef2f6; color:#1e293b; }
  .danger{ background:#ef4444; color:#fff; } .ok{ background:#16a34a; color:#fff; }
  .card{ background:#fafcff; border:1px solid #e2e8f0; border-radius:14px; padding:.9rem; margin:.6rem 0; }
  table{ width:100%; border-collapse:collapse; font-size:.88rem; }
  th{ background:#eef3fb; padding:.3rem; } td,th{ border-bottom:1px solid #e6ecf4; text-align:center; padding:.22rem .18rem; }
  input.cell{ width:100%; min-width:54px; padding:.28rem; border:1px solid #d1d9e6; border-radius:6px; text-align:center; }
  .box{ background:#f8faff; border-left:5px solid #2563eb; border-radius:12px; padding:.85rem 1.3rem; margin:1rem 0; }
  .big{ font-size:1.45rem; font-weight:800; color:#0b1e33; }
  .dim{ color:#64748b; font-size:.82rem; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:1rem; }
  .disttab{ max-height:320px; overflow:auto; display:block; }
  .note{ background:#eff6ff; border:1px dashed #93c5fd; border-radius:10px; padding:.5rem .9rem; font-size:.84rem; color:#1d4ed8; }
</style>
</head>
<body>
<div class="container">
<h1>📊 试卷难度 · 得分分布 · 实力估计 <span style="font-size:.9rem;color:#64748b">（理性时间分配）</span></h1>

<div class="row">
  <label>⏱ T（分）<input id="T" type="number" step="1" min="1" value="180" /></label>
  <label>🎯 实力 μ <input id="mu" type="number" step="0.05" value="15.6" /></label>
  <label>📈 分数 D <input id="D" type="number" step="any" min="0" value="90" /></label>
  <label>🎯 达标概率 q（分位线用）<input id="q" type="number" step="0.05" min="0.01" max="0.99" value="0.5" /></label>
</div>
<div class="row">
  <button class="primary" onclick="computeAll()">▶ 计算</button>
  <button class="ok" onclick="exportJSON()">⬇ 导出试卷JSON</button>
  <button class="ghost" onclick="document.getElementById('fileIn').click()">⬆ 导入试卷JSON</button>
  <input type="file" id="fileIn" accept=".json,application/json" style="display:none" onchange="importJSON(event)" />
  <button class="ghost" onclick="addProblem()">＋ 添加大题</button>
  <span class="dim">档模型 q=Φ(2(μ−a))·Φ(2(log₂t−b+0.5μ+2.5))；E(μ)=max ΣΔv·q（分钟背包DP，收手自动）；难度M：E(M)=满分/2</span>
</div>

<div id="problems"></div>

<div id="out" style="display:none">
  <div class="box"><h3>① 卷面与最优时间分配（μ 给定）</h3>
    <div class="big" id="overview"></div>
    <div class="dim" id="allocNote"></div></div>
  <div class="grid">
    <div class="box"><h3>② 难度 M（期望=满分一半）</h3><div class="big" id="Mbox"></div><div class="dim" id="Mhint"></div></div>
    <div class="box"><h3>③ 由得分 D 估计实力：矩估计 μ̂</h3>
      <div class="big" id="muhat"></div>
      <div class="dim" id="muhat2"></div></div>
  </div>
  <div class="box"><h3>④ “上 D 分线”的难度：分位数线 μ_D(q)（解 P(S≥D;μ)=q）</h3>
    <div class="big" id="quantLine"></div>
    <div class="dim" id="quantNote"></div></div>
  <div class="box"><h3>⑤ 给定 μ 的得分分布</h3>
    <div class="dim" id="distSum"></div>
    <div class="disttab" id="distTab"></div></div>
</div>
</div>

<script>
// ================= 正态 =================
function erf(x){ const s=x<0?-1:1; x=Math.abs(x);
  const a1=.254829592,a2=-.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=.3275911;
  const t=1/(1+p*x); return s*(1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x)); }
const Phi = x => .5*(1+erf(x/Math.SQRT2));
const log2 = x => Math.log(x)/Math.LN2;

// ================= 数据 =================
let problems=[ {main:{score:50,a:16.0,b:17.0}, branches:[{score:20,a:15.5,b:16.0}]},
               {main:{score:50,a:17.0,b:18.0}, branches:[]},
               {main:{score:40,a:15.0,b:15.5}, branches:[]},
               {main:{score:40,a:13.5,b:13.5}, branches:[]} ];
const tiers=p=>{ const all=[p.main,...(p.branches||[])].slice().sort((x,y)=>x.score-y.score);
  const u=[]; let last=-1/0; for(const it of all){ if(it.score!==last){ u.push(it); last=it.score; } } return u; };
function qk(mu,tr,t){ return Phi(2*(mu-tr.a))*Phi(2*(log2(t)-tr.b+0.5*mu+2.5)); }
function fProblem(mu,p,t){ if(!(t>0)) return 0; let E=0,prev=0;
  for(const tr of tiers(p)){ if(tr.score<=prev) continue; E += (tr.score-prev)*qk(mu,tr,t); prev=tr.score; } return E; }
const Smax=()=>problems.reduce((s,p)=>s+p.main.score,0);

// ============ 理性最优分配（分钟背包DP） ============
function plan(mu,T){
  const n=problems.length, dt=T>360?2:1, K=Math.floor(T/dt)+1, f=[];
  for(const p of problems){ const row=new Array(K).fill(0);
    for(let k=1;k<K;k++) row[k]=fProblem(mu,p,k*dt); f.push(row); }
  const V=[]; for(let i=0;i<=n;i++) V.push(new Array(K).fill(0));
  const ARG=[]; for(let i=0;i<n;i++) ARG.push(new Array(K).fill(0));
  for(let i=n-1;i>=0;i--){ const fi=f[i],Vn=V[i+1],Vi=V[i];
    for(let r=0;r<K;r++){ let best=-1,bt=0;
      for(let t=0;t<=r;t++){ const v=fi[t]+Vn[r-t]; if(v>best+1e-12){best=v;bt=t;} }
      Vi[r]=best; ARG[i][r]=bt; } }
  const ts=[]; let rem=K-1;
  for(let i=0;i<n;i++){ const t=ARG[i][rem]; ts.push(t*dt); rem-=t; }
  return {E:V[0][K-1], ts};
}
function Eof(mu,T){ return plan(mu,T).E; }

// 得分分布（给定μ，按最优分配；档位用累积差分）
function getDist(mu,T){
  const pl=plan(mu,T); const pfs=[];
  problems.forEach((p,i)=>{ const t=pl.ts[i];
    const trs=tiers(p); const q=trs.map(tr=> t>0 ? qk(mu,tr,t) : 0);
    let mono=true; for(let j=0;j+1<q.length;j++) if(q[j]<q[j+1]-1e-12) mono=false;
    const pf=[{s:0,p:Math.max(0,1-q[0])}];
    trs.forEach((tr,j)=>{ const nxt=j+1<q.length?q[j+1]:0; pf.push({s:tr.score,p:Math.max(0,q[j]-nxt)}); });
    pfs.push({pf,mono});
  });
  let dp=new Map([[0,1]]);
  for(const {pf} of pfs){ const nd=new Map();
    for(const [s,p] of dp) for(const it of pf){ const ns=s+it.s; nd.set(ns,(nd.get(ns)||0)+p*it.p); } dp=nd; }
  return {dp, ts:pl.ts, E:pl.E};
}
const tailGe=(dp,D)=>[...dp].filter(([s])=>s>=D-1e-9).reduce((a,r)=>a+r[1],0);

// 单调反解（μ 域）
function bis(fn,tg,lo=-30,hi=45){ let a=lo,b=hi;
  while(fn(a)>tg){a-=5;} while(fn(b)<tg){b+=5;}
  for(let i=0;i<80;i++){ const m=(a+b)/2; if(fn(m)<tg)a=m; else b=m; if(b-a<1e-8)break; }
  return (a+b)/2; }

// ================= 界面 =================
function render(){
  const box=document.getElementById('problems');
  if(!problems.length){ box.innerHTML='<div class="card dim">先添加大题</div>'; return; }
  box.innerHTML=problems.map((p,pi)=>`
    <div class="card"><b>题目 #${pi+1} · 满分 ${p.main.score??'?'}</b>
      <button class="danger" style="float:right" onclick="removeProblem(${pi})">删</button>
      <table><tr><th style="width:20%">分值</th><th style="width:26%">门槛 a</th><th style="width:26%">计算 b</th><th style="width:28%">说明</th></tr>
      <tr><td><input class="cell" data-p="${pi}" data-role="main" data-f="score" value="${p.main.score??''}"></td>
          <td><input class="cell" data-p="${pi}" data-role="main" data-f="a" value="${p.main.a??''}"></td>
          <td><input class="cell" data-p="${pi}" data-role="main" data-f="b" value="${p.main.b??''}"></td><td>主档（满分）</td></tr>
      ${(p.branches||[]).map((b,bi)=>`<tr>
          <td><input class="cell" data-p="${pi}" data-role="br" data-bi="${bi}" data-f="score" value="${b.score??''}"></td>
          <td><input class="cell" data-p="${pi}" data-role="br" data-bi="${bi}" data-f="a" value="${b.a??''}"></td>
          <td><input class="cell" data-p="${pi}" data-role="br" data-bi="${bi}" data-f="b" value="${b.b??''}"></td>
          <td>过程分 <button class="danger" style="padding:.1rem .5rem;font-size:.72rem" onclick="removeBranch(${pi},${bi})">✕</button></td></tr>`).join('')}
      </table>
      <button class="ghost" style="padding:.2rem .8rem;font-size:.78rem;margin-top:.35rem" onclick="addBranch(${pi})">＋ 过程分</button>
    </div>`).join('');
  box.querySelectorAll('input.cell').forEach(inp=>{ inp.onchange=()=>{
    const p=problems[+inp.dataset.p], f=inp.dataset.f, v=parseFloat(inp.value), val=isNaN(v)?undefined:v;
    if(inp.dataset.role==='main') p.main[f]=val; else p.branches[+inp.dataset.bi][f]=val; }; });
}
const addProblem=()=>{ problems.push({main:{score:undefined,a:undefined,b:undefined},branches:[]}); render(); };
const removeProblem=i=>{ problems.splice(i,1); render(); };
const addBranch=i=>{ problems[i].branches.push({score:undefined,a:undefined,b:undefined}); render(); };
const removeBranch=(i,j)=>{ problems[i].branches.splice(j,1); render(); };

function readProblems(){ // 从输入框收集并校验
  problems=problems.filter(p=>p.main.score>0)
    .map(p=>({main:p.main, branches:(p.branches||[]).filter(b=>b.score>0&&b.score<p.main.score)}));
  return problems.length>0;
}

// ============ JSON 导入 / 导出 ============
function exportJSON(){
  if(!readProblems()) return alert('没有有效题目');
  const T=Math.round(parseFloat(document.getElementById('T').value)||180);
  const cfg={ version:1, T, note:'a/b/μ 单位：一试1≈10，二试中档≈15，CMO压轴入门≈17',
    problems:problems.map(p=>({ main:clean(p.main),
      branches:(p.branches||[]).map(clean) })) };
  const blob=new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='试卷配置.json'; a.click(); URL.revokeObjectURL(a.href);
}
function clean(o){ const c={}; for(const k of ['score','a','b']) c[k]=o[k]; return c; }
function importJSON(ev){
  const file=ev.target.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
    const cfg=JSON.parse(rd.result);
    if(!cfg.problems||!cfg.problems.length) throw new Error('缺 problems');
    problems=cfg.problems.map(p=>({ main:clean(p.main||{}),
      branches:(p.branches||[]).map(clean) }));
    if(cfg.T>0) document.getElementById('T').value=cfg.T;
    render(); alert('导入成功：'+problems.length+' 道大题');
  }catch(e){ alert('JSON 解析失败：'+e.message); } };
  rd.readAsText(file); ev.target.value='';
}

// ============ 计算 ============
function computeAll(){
  if(!readProblems()) return alert('至少一道有效大题（满分>0）');
  render();
  const T=Math.round(parseFloat(document.getElementById('T').value));
  const mu=parseFloat(document.getElementById('mu').value);
  const D=parseFloat(document.getElementById('D').value);
  const q=parseFloat(document.getElementById('q').value);
  if(!(T>0)) return alert('T>0');
  const S=Smax(), M=bis(mu=>Eof(mu,T), S/2);
  const pl=plan(mu,T);
  const {dp,ts,E}=getDist(mu,T);

  document.getElementById('out').style.display='block';
  document.getElementById('overview').textContent=`n=${problems.length} ｜ 满分 ${S} ｜ T=${T}min ｜ E(μ=${mu})=${E.toFixed(2)}`;
  const alloc=ts.map((t,i)=>`#${i+1}: ${t}min`).join('  ');
  document.getElementById('allocNote').textContent='最优分配 t_i：'+alloc+'（=0 即理性放弃）';

  document.getElementById('Mbox').textContent=`M = ${M.toFixed(3)}`;
  document.getElementById('Mhint').textContent=`E(M)=${S/2}。M越大卷子越难（与a、μ同单位）。`;

  // ③ 矩估计 μ̂(D)
  if(!(D>0&&D<S)){
    document.getElementById('muhat').textContent='—（需 0<D<满分）';
    document.getElementById('muhat2').textContent='';
  }else{
    const mh=bis(mu=>Eof(mu,T), D);
    const g90=getDist(mh,T); // 该 μ 下的分布
    const pge=tailGe(g90.dp,D), pEx=(g90.dp.get(D)||0);
    document.getElementById('muhat').textContent=`μ̂ = ${mh.toFixed(3)}`;
    document.getElementById('muhat2').innerHTML=
      `含义：期望分 = ${D} 时的实力。<br>`+
      `自洽检验：P(S≥${D}｜μ̂)=<b>${pge.toFixed(3)}</b>，P(S=${D}｜μ̂)=${pEx.toFixed(3)}。<br>`+
      `⚠ 这是“均值反演”，不是“达标概率”口径；一次考试估μ噪声约±0.3~0.5，90分与100分对应的μ̂相差0.2~0.3属正常离散噪声。`;
  }

  // ④ 分位数难度线 μ_D(q)
  if(!(D>0&&D<S)){
    document.getElementById('quantLine').textContent='—';
    document.getElementById('quantNote').textContent='';
  }else{
    const mq=bis(mu=>tailGe(getDist(mu,T).dp,D), q);
    document.getElementById('quantLine').textContent=`μ_${D}(${q}) = ${mq.toFixed(3)}`;
    document.getElementById('quantNote').innerHTML=
      `解 P(S≥${D}; μ)=${q} 得到的“稳上${D}分线”。若与相邻分数线 μ_${Math.round(D)===S?S-10:Math.min(S,Math.max(1,D+10))}(...) 接近，说明这两条线在概率意义上基本同档（常见于离散满分档：S≥90 与 S≥100 几乎是同一事件）。<br>`+
      `<b>用哪一个μ？</b>若问“某人重考≥${D}分的概率”，用他本人实考分算出的 μ̂ 代入 P(S≥${D})；若问“这张卷子${D}分线相当于什么实力”，用 μ_${D}(q)（建议 q=0.5~0.8）。两者别混。`;
  }

  // ⑤ 分布表
  const rows=[...dp].sort((a,b)=>a[0]-b[0]);
  const suffix=new Map(); let acc=0;
  for(let i=rows.length-1;i>=0;i--){ acc+=rows[i][1]; suffix.set(rows[i][0],acc); }
  let html='';
  for(const [s,p] of rows){ const hit=Math.abs(s-D)<1e-9;
    html+=`<tr${hit?' style="background:#dbeafe;font-weight:700"':''}><td>${s}</td><td>${p.toFixed(5)}</td><td>${suffix.get(s).toFixed(5)}</td><td>${hit?'◀ D':''}</td></tr>`; }
  document.getElementById('distTab').innerHTML=
    `<table><tr><th>得分 s</th><th>P(S=s)</th><th>P(S≥s)</th><th></th></tr>${html}</table>`;
  const pGe=tailGe(dp,D), pEx2=dp.get(D)||0;
  document.getElementById('distSum').innerHTML=
    `μ=${mu}：E=<b>${E.toFixed(2)}</b>；P(S=${D})=${pEx2.toFixed(4)}；P(S≥${D})=<b>${pGe.toFixed(4)}</b>。`;
}
render();
</script>
</body>
</html>
